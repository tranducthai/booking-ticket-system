server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mirrors apps/web/vite.config.ts's dev proxy so the SPA can keep using a
  # relative "/api" base URL in both dev and this production image — no
  # VITE_API_BASE_URL build arg, no CORS, works behind any LB placed in
  # front of this container later. api-gateway resolves via Swarm's
  # internal DNS (see infra/swarm/docker-stack.yml, same `backend` network).
  location /api/ {
    # nginx's default body limit is 1 MB; event-service accepts images up to
    # 5 MB (MAX_IMAGE_BYTES) plus multipart overhead, and enforces that itself.
    client_max_body_size 6m;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://api-gateway:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback — React Router owns client-side routing.
  # index.html must be revalidated on every load — it names the hashed bundle,
  # so a browser heuristically caching it keeps serving the previous build.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
