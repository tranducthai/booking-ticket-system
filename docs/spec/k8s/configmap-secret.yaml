apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
data:
  redis_host: "redis-master.booking-ns.svc.cluster.local:6379"

---
apiVersion: v1
kind: Secret
metadata:
  name: booking-service-secret
type: Opaque
stringData:
  # In practice: DO NOT commit real values to Git.
  # Use kubectl create secret, or an External Secrets Operator connected to Vault/AWS Secrets Manager.
  database_url: "postgres://user:password@booking-db:5432/booking"
