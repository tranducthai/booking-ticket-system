apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels:
    app: booking-service
spec:
  replicas: 3                      # initial container count — the orchestrator always tries to keep exactly this number
  selector:
    matchLabels:
      app: booking-service
  strategy:
    type: RollingUpdate            # deploy a new version with zero downtime
    rollingUpdate:
      maxSurge: 1                  # allowed to create 1 extra pod during a rolling update
      maxUnavailable: 0            # not allowed to drop below the current replica count during an update
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: your-registry/booking-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: booking-service-config
                  key: redis_host
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-service-secret
                  key: database_url

          # --- Resource limits: the basis HPA uses to compute CPU/RAM utilization % ---
          resources:
            requests:               # minimum resources guaranteed to be allocated
              cpu: "250m"
              memory: "256Mi"
            limits:                 # hard cap — exceeding this gets throttled/killed
              cpu: "500m"
              memory: "512Mi"

          # --- Startup probe: gives the container time to start up (connect to DB, Redis...) ---
          # While the startup probe hasn't passed yet, the liveness/readiness probes are
          # temporarily skipped, so the orchestrator doesn't mistakenly kill a slow-starting container.
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            failureThreshold: 30
            periodSeconds: 2        # waits at most 30*2 = 60 seconds for startup to finish

          # --- Readiness probe: "is the container ready to receive traffic yet?" ---
          # Fail -> Service stops sending requests to this pod, but does NOT kill it
          # (used when the pod is temporarily overloaded or warming up its cache, not an error)
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2

          # --- Liveness probe: "is the container still alive/responsive?" ---
          # Fails repeatedly past the threshold -> orchestrator KILLS the pod and creates a replacement
          # This is exactly the "self-replace on crash" mechanism you asked about
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 2

      terminationGracePeriodSeconds: 30   # gives the pod 30s to finish in-flight requests before being killed
