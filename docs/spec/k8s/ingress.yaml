apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ticket-platform-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Rate limiting at the Ingress layer - an additional defense layer before the waiting room
    nginx.ingress.kubernetes.io/limit-rps: "5000"
spec:
  ingressClassName: nginx    # uses the NGINX Ingress Controller (plays the role equivalent to an ALB)
  rules:
    - host: api.ticketplatform.local
      http:
        paths:
          - path: /booking(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: booking-service
                port:
                  number: 80
          - path: /event(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: event-service
                port:
                  number: 80
          - path: /user(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: user-service
                port:
                  number: 80
          - path: /payment(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: payment-service
                port:
                  number: 80
          - path: /ticket(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: ticket-service
                port:
                  number: 80
