# Render Blueprint — deploys the whole system (7 backend services + the
# frontend) from one repo in one pass: https://dashboard.render.com/blueprints
# "New Blueprint Instance" -> pick this repo -> Render finds this file.
#
# The frontend (apps/web) is deployed to Vercel instead — see apps/web/vercel.json.
#
# Postgres/Redis/RabbitMQ/SMTP are NOT included here (Render's own free
# Postgres expires after 90 days) — provision those separately as free
# external services and paste their connection strings in when Render
# prompts for the `sync: false` values below:
#   - Postgres: https://neon.tech — ONE database, one schema per service:
#     the same direct (non "-pooler") connection string for every service,
#     each with its own `&schema=user_svc|event_svc|booking_svc|payment_svc|
#     ticket_svc|notification_svc` (tables like ActivityLog/_prisma_migrations
#     exist in several services, so they can't share a schema). Run
#     `prisma migrate deploy` per service against it before the first deploy —
#     the containers don't migrate on start.
#   - Redis: https://upstash.com (free db, use the "rediss://" TLS URL)
#   - RabbitMQ: https://www.cloudamqp.com (free "Little Lemur" plan)
#   - SMTP (optional, real email): https://www.brevo.com free plan
#
# The *_SERVICE_URL / SELF_BASE_URL / FRONTEND_URL / CORS_ORIGIN vars can't
# be known until Render assigns each service's onrender.com URL, so they're
# also `sync: false` — deploy once, copy each service's URL from the Render
# dashboard, paste them into the services that call it, save (redeploys
# automatically). See the deploy guide for the exact order.

envVarGroups:
  - name: app-secrets
    envVars:
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TICKET_SIGNING_SECRET
        generateValue: true
      - key: INTERNAL_TOKEN
        generateValue: true

services:
  - type: web
    name: user-service
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/user-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Publishes PasswordResetRequested — same CloudAMQP URL as the other services.
      - key: RABBITMQ_URL
        sync: false
      # Session allow-list — the same Upstash URL as event-service, api-gateway, notification-service.
      - key: REDIS_URL
        sync: false
      # Google login: OAuth client from https://console.cloud.google.com/apis/credentials.
      # Its "Authorized redirect URI" must be EXACTLY GOOGLE_REDIRECT_URI:
      # https://<api-gateway>.onrender.com/user/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_REDIRECT_URI
        sync: false

  - type: web
    name: event-service
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/event-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      # Supabase Storage (images + refund evidence) — buckets are created on boot.
      - key: SUPABASE_URL
        value: https://mbqpfmcmyvkavjtblvdq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SEAT_HOLD_TTL_SECONDS
        value: "600"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false

  - type: web
    name: booking-service
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/booking-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      - key: HOLD_TTL_SECONDS
        value: "600"
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: EVENT_SERVICE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        sync: false

  - type: web
    name: payment-service
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/payment-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      # Supabase Storage (images + refund evidence) — buckets are created on boot.
      - key: SUPABASE_URL
        value: https://mbqpfmcmyvkavjtblvdq.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # "live" = real gateways; with only SePay configured, pick "Chuyển khoản (VietQR)" at checkout.
      - key: PAYMENT_GATEWAY_MODE
        value: live
      - key: SEPAY_BANK
        sync: false
      - key: SEPAY_ACCOUNT_NUMBER
        sync: false
      - key: SEPAY_ACCOUNT_NAME
        sync: false
      - key: SEPAY_WEBHOOK_API_KEY
        sync: false
      - key: SEPAY_API_TOKEN
        sync: false
      - key: SEPAY_PAYMENT_PREFIX
        value: TBX
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: BOOKING_SERVICE_URL
        sync: false
      - key: EVENT_SERVICE_URL
        sync: false
      - key: TICKET_SERVICE_URL
        sync: false
      - key: SELF_BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: ticket-service
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/ticket-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: EVENT_SERVICE_URL
        sync: false
      - key: TICKET_SIGNING_PRIVATE_KEY
        sync: false

  - type: web
    name: notification-service
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/notification-service/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      # Render's free tier blocks outbound SMTP (25/465/587) — send through Brevo's HTTPS API instead.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      # Base of the links inside emails (reset password, manage event, view order) — the Vercel URL.
      - key: FRONTEND_URL
        sync: false
      # Socket.io: accept only the Vercel origin; same Upstash Redis as user-service for session checks.
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RABBITMQ_URL
        sync: false
      - key: USER_SERVICE_URL
        sync: false
      - key: EVENT_SERVICE_URL
        sync: false
      - key: TICKET_SERVICE_URL
        sync: false

  - type: web
    name: api-gateway
    runtime: docker
    plan: free
    region: singapore # same region as the Neon database
    dockerfilePath: apps/api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - fromGroup: app-secrets
      - key: CORS_ORIGIN
        sync: false # the Vercel URL, e.g. https://ticketbox.vercel.app
      # Render's edge proxy is one hop — the client IP is the last X-Forwarded-For entry it adds.
      - key: TRUST_PROXY_HOPS
        value: "1"
      # Session allow-list written by user-service (logout / single-session revocation).
      - key: REDIS_URL
        sync: false
      - key: USER_SERVICE_URL
        sync: false
      - key: EVENT_SERVICE_URL
        sync: false
      - key: BOOKING_SERVICE_URL
        sync: false
      - key: PAYMENT_SERVICE_URL
        sync: false
      - key: TICKET_SERVICE_URL
        sync: false
      - key: NOTIFICATION_SERVICE_URL
        sync: false
